name: Build and push images

on:
  workflow_dispatch:
    inputs:
      ref:
        type: string
        required: true
      platforms:
        type: string
        default: linux/x86_64

jobs:
  build-toolkit:
    permissions:
      packages: write
    runs-on: ubuntu-24.04
    env:
      TOOLKIT_REPO: ghcr.io/${{github.repository}}/elemental-cli 
      REPO: ghcr.io/${{github.repository}}/elemental-${{ github.event.inputs.flavor }} 
    steps:
      - name: Setup QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - name: Setup Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          install: true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.inputs.ref }}
      - run: |
          git fetch --prune --unshallow
      - name: Log in to ghcr.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build toolkit
        run: |
          make PLATFORM=${{ github.event.inputs.platforms }} DOCKER_ARGS=--push VERSION=${{ github.event.inputs.ref }} build
