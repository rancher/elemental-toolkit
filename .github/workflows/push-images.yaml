name: Build and push images

on:
  workflow_dispatch:
    inputs:
      ref:
        type: string
        required: true
      platforms:
        type: string
        default: linux/x86_64

jobs:
  build-toolkit:
    permissions:
      packages: write
    runs-on: ubuntu-24.04
    env:
      TOOLKIT_REPO: ghcr.io/${{github.repository}}/elemental-cli 
      REPO: ghcr.io/${{github.repository}}/elemental-${{ github.event.inputs.flavor }} 
    steps:
      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          install: true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.inputs.ref }}
      - run: |
          git fetch --prune --unshallow
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build toolkit
        run: |
          make PLATFORM=${{ github.event.inputs.platforms }} DOCKER_ARGS=--push VERSION=${{ github.event.inputs.ref }} build
